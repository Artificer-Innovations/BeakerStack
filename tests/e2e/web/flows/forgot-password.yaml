# Web E2E: Forgot password UI (no email inbox)
url: ${WEB_URL}
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/navigate-login.yaml
- tapOn: 'Forgot password?'
- waitForAnimationToEnd
- assertVisible: 'Reset your password'
- inputText:
    id: 'email'
    text: '${E2E_LOGIN_EMAIL}'
- tapOn: 'Send reset link'
- waitForAnimationToEnd
- assertVisible: 'receive a password reset email'
