# Web E2E: Smoke suite (landing + signup) — kept for backward compatibility
url: ${WEB_URL}
---
- launchApp
- waitForAnimationToEnd
- assertVisible: 'Beaker Stack'
- assertVisible: 'Everything you need to ship a real product.'
- runFlow:
    file: ../subflows/navigate-signup.yaml
- runFlow:
    file: ../subflows/fill-signup.yaml
- runFlow:
    file: ../subflows/assert-dashboard.yaml
