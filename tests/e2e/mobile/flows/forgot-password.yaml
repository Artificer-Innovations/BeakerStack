# Mobile E2E: Forgot password UI
appId: ${MOBILE_APP_ID}
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/navigate-login.yaml
- tapOn: 'Forgot password?'
- waitForAnimationToEnd
- assertVisible: 'Reset your password'
- tapOn:
    id: 'email'
- inputText: '${E2E_LOGIN_EMAIL}'
- tapOn:
    id: 'forgot-password-submit'
- waitForAnimationToEnd
- assertVisible: 'receive a password reset email'
