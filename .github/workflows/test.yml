name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      # Application code and tests
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      # Database schema and migrations
      - 'supabase/**'
      # Dependencies and configuration
      - 'package.json'
      - 'package-lock.json'
      - '**/package.json'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - '**/jest.config.*'
      - '**/*.config.js'
      - '**/*.config.ts'
      - '**/babel.config.*'
      - '**/metro.config.*'
      - '**/vite.config.*'
      # Scripts and repo lint config (lint covers scripts/**)
      - 'scripts/**'
      - '.eslintrc.js'
      # Workflow and composite actions
      - '.github/workflows/test.yml'
      - '.github/actions/**'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  lint:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Run lint
        run: npm run lint

  type-check:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Type check
        run: npm run type-check

  unit-coverage:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run unit tests with coverage
        id: run-tests
        continue-on-error: true
        env:
          COVERAGE_MERGE: '1'
        run: |
          mkdir -p ci
          set -o pipefail
          (
            npm run test:coverage:mobile &&
            npm run test:coverage:web &&
            npm run test:coverage:shared &&
            npm run test:coverage:billing &&
            npm run test:coverage:admin &&
            npm run test:coverage:lifecycle-events &&
            npm run test:coverage:waitlist &&
            npm run test:coverage:email &&
            npm run test:coverage:observability &&
            npm run test:unit:scripts
          ) 2>&1 | tee ci/unit-coverage.log

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-reports
          path: |
            apps/web/coverage
            apps/mobile/coverage
            packages/shared-tests/coverage
            packages/billing/coverage
            packages/admin/coverage
            packages/waitlist/coverage
            packages/email/coverage
            packages/lifecycle-events/coverage
            packages/observability/coverage
          if-no-files-found: warn

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-log
          path: ci/unit-coverage.log
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

  integration:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_EMAIL: ci-test@example.com

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Start Supabase services
        run: |
          mkdir -p .supabase/logs
          supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics > .supabase/logs/start.log 2>&1
          supabase status > .supabase/logs/status.log 2>&1
          cat .supabase/logs/status.log

      - name: Export Supabase credentials from local stack
        run: ./scripts/ci-export-supabase-env.sh

      - name: Run integration tests
        id: run-tests
        continue-on-error: true
        run: |
          mkdir -p ci
          set -o pipefail
          (
            npm run test:integration &&
            cd apps/web && npx vitest run src/lib/supabase.test.ts
          ) 2>&1 | tee ci/integration.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: ci/integration.log
          if-no-files-found: warn

      - name: Upload Supabase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-supabase-logs
          path: .supabase/logs
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Stop Supabase services
        if: always()
        run: supabase stop || true

  db-tests:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Start Supabase services
        run: |
          mkdir -p .supabase/logs
          supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics > .supabase/logs/start.log 2>&1
          supabase status > .supabase/logs/status.log 2>&1
          cat .supabase/logs/status.log

      - name: Export Supabase credentials from local stack
        run: ./scripts/ci-export-supabase-env.sh

      - name: Run database tests
        id: run-tests
        continue-on-error: true
        run: |
          mkdir -p ci
          set -o pipefail
          npm run test:db 2>&1 | tee ci/db-tests.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-tests-log
          path: ci/db-tests.log
          if-no-files-found: warn

      - name: Upload Supabase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-tests-supabase-logs
          path: .supabase/logs
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Stop Supabase services
        if: always()
        run: supabase stop || true

  coverage-report:
    needs: [unit-coverage, integration, db-tests]
    if: always() && !cancelled() && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download unit coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-coverage-reports
          path: .

      - name: Download test logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-log'
          merge-multiple: true
          path: .

      - name: Merge coverage and test logs
        id: build-summary
        run: |
          mkdir -p coverage
          node scripts/merge-coverage.js
          cat ci/unit-coverage.log ci/integration.log ci/db-tests.log > ci/test-output.log 2>/dev/null || true
          node scripts/format-ci-summary.mjs \
            --coverage coverage/coverage-summary.json \
            --test-log ci/test-output.log \
            --json-output ci/summary.json \
            --markdown-output ci/comment.md
          {
            printf 'comment<<EOF_COMMENT\n'
            cat ci/comment.md
            printf '\nEOF_COMMENT\n'
          } >> "$GITHUB_OUTPUT"

      - name: Comment coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coverage-comment -->';
            let body = process.env.COMMENT_BODY?.trim();
            if (!body) {
              core.info('No comment body provided; skipping.');
              return;
            }

            const now = new Date();
            const pacificTime = now.toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'long',
              timeStyle: 'short'
            });
            const timezone = now.toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              timeZoneName: 'short'
            }).split(' ').pop();
            body = `${body}\n\n---\n\n_Updated at: ${pacificTime} ${timezone}_`;

            const canWrite =
              (context.eventName === 'pull_request' &&
                context.payload.pull_request &&
                context.payload.pull_request.head.repo.full_name ===
                  context.repo.owner + '/' + context.repo.repo) ||
              process.env.GITHUB_TOKEN_SCOPE?.includes('write');

            if (!canWrite) {
              core.warning(
                'GITHUB_TOKEN lacks write permission (likely a fork PR); skipping comment.'
              );
              return;
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });

              const existing = comments.find(comment =>
                comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  `Insufficient permissions to comment on PR: ${error.message}`
                );
                return;
              }
              throw error;
            }
        env:
          COMMENT_BODY: ${{ steps.build-summary.outputs.comment }}

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/
          if-no-files-found: warn

      - name: Upload package coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-packages
          path: |
            apps/web/coverage
            apps/mobile/coverage
            packages/shared-tests/coverage
            packages/billing/coverage
            packages/admin/coverage
            packages/waitlist/coverage
            packages/email/coverage
            packages/lifecycle-events/coverage
            packages/observability/coverage
          if-no-files-found: warn

      - name: Fail if upstream test jobs failed
        if: needs.unit-coverage.result == 'failure' || needs.integration.result == 'failure' || needs.db-tests.result == 'failure'
        run: exit 1
