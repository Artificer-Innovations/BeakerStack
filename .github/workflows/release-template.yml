name: Release Template

on:
  workflow_dispatch:
    inputs:
      override_tag:
        description: 'Override computed tag (e.g. 2026.003) — leave blank to auto-compute'
        required: false

jobs:
  release:
    name: Cut CalVer release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate override tag format
        if: inputs.override_tag != ''
        run: |
          if [[ ! "${{ inputs.override_tag }}" =~ ^[0-9]{4}\.[0-9]{3}$ ]]; then
            echo "Invalid tag format '${{ inputs.override_tag }}' — must match YYYY.NNN (e.g. 2026.003)"
            exit 1
          fi

      - name: Compute next CalVer tag
        id: tag
        run: |
          if [[ -n "${{ inputs.override_tag }}" ]]; then
            echo "tag=${{ inputs.override_tag }}" >> $GITHUB_OUTPUT
          else
            YEAR=$(date +%Y)
            LAST_N=$(git tag -l "${YEAR}.*" | sed "s/${YEAR}\.//" | sort -n | tail -1)
            NEXT_N=$(( ${LAST_N:-0} + 1 ))
            printf -v PADDED_N "%03d" $NEXT_N
            echo "tag=${YEAR}.${PADDED_N}" >> $GITHUB_OUTPUT
          fi

      # orhun/git-cliff-action@v3 builds a Docker image on Debian buster; apt repos are EOL (404).
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.13.1
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch_suffix=x86_64 ;;
            aarch64) arch_suffix=aarch64 ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-${arch_suffix}-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        run: |
          git-cliff \
            --config cliff.toml \
            --tag-pattern '^[0-9]{4}\.' \
            --tag "${{ steps.tag.outputs.tag }}" \
            --latest \
            --output RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.tag.outputs.tag }} -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
