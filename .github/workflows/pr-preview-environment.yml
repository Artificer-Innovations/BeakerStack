# PR previews only (deploy.<domain>/pr-N). Staging/production deploys are deploy-staging.yml (develop) and deploy-production.yml (main).
name: PR Preview Environments

on:
  pull_request:
    # Previews only for PRs into develop (not release PRs into main / hotfix→main).
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
      - closed

permissions:
  contents: read
  pull-requests: write
  id-token: write
  deployments: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}

jobs:
  preview-scope:
    # Skip main→develop sync PRs, closed events not followed by teardown, and edited events
    # that only changed the PR title/body (not the base branch — those should redeploy).
    if: >-
      github.event.action != 'closed' &&
      (github.base_ref != 'develop' || github.head_ref != 'main') &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    outputs:
      run_deploy: ${{ steps.check.outputs.run_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide if PR preview deploy is needed
        id: check
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/pr-preview/check-preview-deploy-needed.sh \
            "origin/${{ github.base_ref }}" \
            "HEAD"

      - name: Log when preview deploy is skipped
        if: steps.check.outputs.run_deploy != 'true'
        run: echo "Skipping PR preview deploy (no app/package/supabase/pr-preview changes)."

  deploy-preview:
    if: github.event.action != 'closed' && needs.preview-scope.outputs.run_deploy == 'true' && (github.base_ref != 'develop' || github.head_ref != 'main')
    needs: preview-scope
    runs-on: ubuntu-latest
    outputs:
      bootstrap-url: ${{ steps.signed_cookies.outputs.BOOTSTRAP_URL }}
      access-mode: ${{ steps.signed_cookies.outputs.ACCESS_MODE }}
      supabase-outcome: ${{ steps.supabase.outcome }}
      stripe-sync-outcome: ${{ steps.stripe-sync.outcome }}
      stripe-webhook-outcome: ${{ steps.stripe_webhook_preview.outcome }}
      billing-functions-outcome: ${{ steps.billing-functions.outcome }}
      web-outcome: ${{ steps.web.outcome }}
    env:
      PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
      PREVIEW_HOSTED_ZONE_ID: ${{ vars.PR_PREVIEW_HOSTED_ZONE_ID }}
      PREVIEW_CERTIFICATE_ARN: ${{ secrets.PR_PREVIEW_CERTIFICATE_ARN }}
      PREVIEW_STACK_NAME: ${{ vars.PR_PREVIEW_STACK_NAME }}
      PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
      SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
      SUPABASE_PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}

      - name: Bootstrap preview infrastructure
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${PREVIEW_STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PREVIEW_AWS_REGION:-us-east-1}"
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          ./scripts/pr-preview/bootstrap-aws-stack.sh \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --domain "${PREVIEW_DOMAIN}" \
            --hosted-zone-id "${PREVIEW_HOSTED_ZONE_ID}" \
            --certificate-arn "${PREVIEW_CERTIFICATE_ARN}" \
            --preview-prefix "${PREVIEW_PREFIX_VALUE}" \
            --skip-cloudfront-function-publish

      - name: Prepare Supabase preview database
        id: supabase
        shell: bash
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_MAX_RETRIES: 5
        run: |
          set -euo pipefail
          ./scripts/pr-preview/reset-preview-database.sh \
            --pr-number "${PR_NUMBER}" \
            --project-ref "${SUPABASE_PREVIEW_PROJECT_REF}" \
            --db-password "${SUPABASE_PREVIEW_DB_PASSWORD}" \
            --baseline-ref "${{ github.base_ref }}" \
            --skip-if-unchanged

      # Opt-in: skipped in-script when RESEND_SMTP_PASS unset (secrets cannot be used in if:)
      - name: Sync Supabase auth email config (preview)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
          SUPABASE_AUTH_SITE_URL: ${{ format('https://deploy.{0}', vars.PR_PREVIEW_DOMAIN) }}
          SUPABASE_ADDITIONAL_REDIRECT_URL: ${{ format('https://deploy.{0}/pr-{1}/auth/confirm', vars.PR_PREVIEW_DOMAIN, github.event.pull_request.number) }}
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: '587'
          SMTP_USER: resend
          SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_PASS:-}" ]; then
            echo "Skipping Supabase auth email config: RESEND_SMTP_PASS is not set."
            exit 0
          fi
          if [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}" ] || [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-}" ]; then
            echo "Skipping Supabase auth email config: SUPABASE_AUTH_EXTERNAL_GOOGLE_* secrets are not set."
            echo "  Run npm run setup:full (google phase) or: gh secret set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID"
            exit 0
          fi
          ./scripts/sync-supabase-auth-config.sh \
            --project-ref "${SUPABASE_PREVIEW_PROJECT_REF}" \
            --db-password "${SUPABASE_PREVIEW_DB_PASSWORD}" \
            --site-url "${SUPABASE_AUTH_SITE_URL}" \
            --additional-redirect-url "${SUPABASE_ADDITIONAL_REDIRECT_URL}"

      - name: Sync Stripe prices to preview billing_plans
        id: stripe-sync
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_TESTING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run billing:sync-stripe

      - name: Ensure Stripe webhook endpoint (preview)
        id: stripe_webhook_preview
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}/functions/v1/stripe-webhook
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PREVIEW_STRIPE_WEBHOOK_SECRET }}
          WEBHOOK_DESCRIPTION: BeakerStack preview (${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }})
        run: node scripts/ensure-stripe-webhook-endpoint.mjs

      - name: Deploy preview billing edge functions
        id: billing-functions
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          SUPABASE_PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          PR_TESTING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_TESTING_SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          PREVIEW_STRIPE_WEBHOOK_SECRET: ${{ steps.stripe_webhook_preview.outputs.resolved_webhook_secret }}
          PREVIEW_BILLING_ALLOWED_ORIGINS: ${{ secrets.PREVIEW_BILLING_ALLOWED_ORIGINS }}
          SUPABASE_MAX_RETRIES: 5
        run: |
          set -euo pipefail
          chmod +x ./scripts/pr-preview/deploy-preview-billing-functions.sh
          ./scripts/pr-preview/deploy-preview-billing-functions.sh

      - name: Build and deploy web preview
        id: web
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          PR_NUMBER_VALUE="${PR_NUMBER}"
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-${{ steps.bootstrap.outputs.PR_PREVIEW_PREFIX }}}"
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX_VALUE:-pr-}"
          AWS_REGION_VALUE="${PREVIEW_AWS_REGION:-us-east-1}"
          ./scripts/pr-preview/deploy-web.sh \
            --pr-number "${PR_NUMBER_VALUE}" \
            --bucket "${{ steps.bootstrap.outputs.PR_PREVIEW_WEBSITE_BUCKET }}" \
            --distribution-id "${{ steps.bootstrap.outputs.PR_PREVIEW_DISTRIBUTION_ID }}" \
            --domain "${PREVIEW_DOMAIN}" \
            --environment preview \
            --preview-prefix "${PREVIEW_PREFIX_VALUE}" \
            --region "${AWS_REGION_VALUE}"

      # Generate CloudFront signed cookies and post GitHub Deployment with access URL.
      # Skipped when neither signing secret is set (public access mode). Partial config fails the step.
      - name: Generate signed cookie bootstrap URL
        id: signed_cookies
        if: steps.web.outcome == 'success'
        shell: bash
        env:
          CLOUDFRONT_SIGNING_KEY: ${{ secrets.CLOUDFRONT_SIGNING_KEY }}
          CLOUDFRONT_SIGNING_KEY_ID: ${{ secrets.CLOUDFRONT_SIGNING_KEY_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # secrets.* is not allowed in step `if:` — gate here (public preview when neither secret is set).
          if [[ -z "${CLOUDFRONT_SIGNING_KEY:-}" && -z "${CLOUDFRONT_SIGNING_KEY_ID:-}" ]]; then
            exit 0
          fi
          if [[ -z "${CLOUDFRONT_SIGNING_KEY:-}" || -z "${CLOUDFRONT_SIGNING_KEY_ID:-}" ]]; then
            echo "::error::CLOUDFRONT_SIGNING_KEY and CLOUDFRONT_SIGNING_KEY_ID must both be set. Configure both secrets or neither."
            exit 1
          fi
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          DEPLOY_DOMAIN="deploy.${PREVIEW_DOMAIN}"
          DEST="/${PREVIEW_PREFIX_VALUE}${PR_NUMBER}/"
          RESOURCE="https://${DEPLOY_DOMAIN}/${PREVIEW_PREFIX_VALUE}${PR_NUMBER}/*"
          EXPIRY=$(date -u -d "+7 days" +%s)

          POLICY_JSON=$(printf '{"Statement":[{"Resource":"%s","Condition":{"DateLessThan":{"AWS:EpochTime":%s}}}]}' \
            "${RESOURCE}" "${EXPIRY}")

          # CloudFront URL-safe base64: + → -, / → ~, = → _
          CF_POLICY=$(printf '%s' "${POLICY_JSON}" | base64 -w0 | tr '+' '-' | tr '/' '~' | tr '=' '_')

          # Sign with RSA-SHA1 (CloudFront signed cookies requirement)
          KEY_FILE=$(mktemp); chmod 600 "${KEY_FILE}"
          printf '%s' "${CLOUDFRONT_SIGNING_KEY}" > "${KEY_FILE}"
          CF_SIGNATURE=$(printf '%s' "${POLICY_JSON}" | \
            openssl dgst -sha1 -sign "${KEY_FILE}" | base64 -w0 | tr '+' '-' | tr '/' '~' | tr '=' '_')
          rm -f "${KEY_FILE}"

          ENCODED_DEST=$(printf '%s' "${DEST}" | python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.stdin.read().strip()))")
          BOOTSTRAP_URL="https://${DEPLOY_DOMAIN}/_preview-auth?policy=${CF_POLICY}&sig=${CF_SIGNATURE}&kid=${CLOUDFRONT_SIGNING_KEY_ID}&dest=${ENCODED_DEST}"
          echo "BOOTSTRAP_URL=${BOOTSTRAP_URL}" >> "${GITHUB_OUTPUT}"
          echo "ACCESS_MODE=signed-cookies" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Deployment (PR preview)
        if: steps.web.outcome == 'success'
        uses: actions/github-script@v7
        env:
          BOOTSTRAP_URL: ${{ steps.signed_cookies.outputs.BOOTSTRAP_URL }}
          PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
          PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            // Fork PRs: pull_request events from forks run with a read-only token;
            // deployments: write is unavailable — skip cleanly rather than error.
            // head.repo can be null when the fork is deleted before the workflow runs.
            const headRepo = context.payload.pull_request.head.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (!headRepo || headRepo !== baseRepo) {
              core.info(`Skipping: fork PR (${headRepo ?? 'deleted repo'}) — Deployments API write not available for fork PRs.`);
              return;
            }

            const environment = `pr-${process.env.PR_NUMBER}-preview`;
            const prefix = process.env.PREVIEW_PREFIX || 'pr-';
            const webUrl = `https://deploy.${process.env.PREVIEW_DOMAIN}/${prefix}${process.env.PR_NUMBER}/`;
            const environmentUrl = process.env.BOOTSTRAP_URL || webUrl;
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Create the new deployment first. Only deactivate previous deployments
            // after success so a partial failure doesn't leave the PR Deployments
            // panel empty. Use head.sha (not context.sha which is the synthetic merge
            // commit) so GitHub associates the deployment with the PR's own head ref.
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment,
              auto_merge: false,
              required_contexts: [],
              description: `PR #${process.env.PR_NUMBER} preview`,
            });
            if (!deployment.data.id) {
              core.warning(`createDeployment returned no id (HTTP ${deployment.status}): ${deployment.data.message ?? JSON.stringify(deployment.data)}`);
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: environmentUrl,
              log_url: logUrl,
              description: 'Preview deployed',
            });

            // Deactivate previous deployments for this environment now that the new
            // one is registered, keeping only one active row on the PR Deployments tab.
            const { data: existing } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment,
              per_page: 100,
            });
            for (const dep of existing) {
              if (dep.id === deployment.data.id) continue;
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: dep.id,
                state: 'inactive',
              });
            }

      # Publish edge routing only after a successful web build so a failed deploy cannot
      # replace live CloudFront function code while leaving stale or missing S3 assets.
      - name: Publish PR path router (CloudFront)
        if: steps.web.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${PREVIEW_STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PREVIEW_AWS_REGION:-us-east-1}"
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          ./scripts/pr-preview/bootstrap-aws-stack.sh \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --domain "${PREVIEW_DOMAIN}" \
            --hosted-zone-id "${PREVIEW_HOSTED_ZONE_ID}" \
            --certificate-arn "${PREVIEW_CERTIFICATE_ARN}" \
            --preview-prefix "${PREVIEW_PREFIX_VALUE}" \
            --if-stack-exists refresh-outputs

  deploy-preview-mobile:
    if: github.event.action != 'closed' && needs.preview-scope.outputs.run_deploy == 'true' && (github.base_ref != 'develop' || github.head_ref != 'main') && vars.MOBILE_ENABLED != 'false'
    needs: [preview-scope]
    runs-on: ubuntu-latest
    outputs:
      mobile-channel: ${{ steps.mobile.outputs.PREVIEW_MOBILE_CHANNEL }}
      mobile-update-url: ${{ steps.mobile.outputs.PREVIEW_MOBILE_UPDATE_URL }}
      mobile-ios-download-url: ${{ steps.mobile.outputs.PREVIEW_MOBILE_IOS_DOWNLOAD_URL }}
      mobile-android-download-url: ${{ steps.mobile.outputs.PREVIEW_MOBILE_ANDROID_DOWNLOAD_URL }}
      needs-native-build: ${{ steps.native-changes.outputs.needs_native_build }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for native code changes
        id: native-changes
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref }}"
          HEAD_REF="HEAD"
          if ./scripts/pr-preview/check-native-changes.sh "${BASE_REF}" "${HEAD_REF}"; then
            echo "needs_native_build=true" >> $GITHUB_OUTPUT
          else
            echo "needs_native_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy mobile preview
        id: mobile
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_PROJECT_NUMBER: ${{ secrets.GOOGLE_SERVICES_PROJECT_NUMBER }}
          GOOGLE_SERVICES_PROJECT_ID: ${{ secrets.GOOGLE_SERVICES_PROJECT_ID }}
          GOOGLE_SERVICES_STORAGE_BUCKET: ${{ secrets.GOOGLE_SERVICES_STORAGE_BUCKET }}
          GOOGLE_SERVICES_MOBILESDK_APP_ID: ${{ secrets.GOOGLE_SERVICES_MOBILESDK_APP_ID }}
          GOOGLE_SERVICES_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_ANDROID_CLIENT_ID }}
          GOOGLE_SERVICES_ANDROID_CERTIFICATE_HASH: ${{ secrets.GOOGLE_SERVICES_ANDROID_CERTIFICATE_HASH }}
          GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_IOS_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_IOS_CLIENT_ID }}
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
        run: |
          set -euo pipefail
          PR_NUMBER_VALUE="${PR_NUMBER}"
          EXPO_ACCOUNT_VALUE="${{ vars.EXPO_ACCOUNT }}"
          if [[ -z "${EXPO_ACCOUNT_VALUE}" ]]; then
            if [[ "${{ vars.MOBILE_ENABLED }}" == "true" ]]; then
              echo "::error::EXPO_ACCOUNT variable is not set but MOBILE_ENABLED=true. Set vars.MOBILE_ENABLED=false to disable mobile, or provide EXPO_ACCOUNT."
              exit 1
            else
              echo "Warning: EXPO_ACCOUNT not set, skipping mobile deployment"
              exit 0
            fi
          fi
          BUILD_NATIVE_FLAG=""
          if [[ "${{ steps.native-changes.outputs.needs_native_build }}" == "true" ]]; then
            BUILD_NATIVE_FLAG="--build-native"
            echo "Native code changes detected - will build native apps"
          else
            echo "No native code changes - skipping native build (using OTA updates only)"
          fi
          ./scripts/pr-preview/deploy-mobile.sh \
            --pr-number "${PR_NUMBER_VALUE}" \
            --expo-account "${EXPO_ACCOUNT_VALUE}" \
            --platform all \
            ${BUILD_NATIVE_FLAG}

  comment:
    if: always() && needs.deploy-preview.result == 'success'
    needs: [deploy-preview, deploy-preview-mobile]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post preview summary comment
        uses: actions/github-script@v7
        env:
          PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
          PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
          BOOTSTRAP_URL: ${{ needs.deploy-preview.outputs.bootstrap-url }}
          ACCESS_MODE: ${{ needs.deploy-preview.outputs.access-mode }}
          SUPABASE_OUTCOME: ${{ needs.deploy-preview.outputs.supabase-outcome }}
          STRIPE_SYNC_OUTCOME: ${{ needs.deploy-preview.outputs.stripe-sync-outcome }}
          STRIPE_WEBHOOK_OUTCOME: ${{ needs.deploy-preview.outputs.stripe-webhook-outcome }}
          BILLING_FUNCTIONS_OUTCOME: ${{ needs.deploy-preview.outputs.billing-functions-outcome }}
          WEB_OUTCOME: ${{ needs.deploy-preview.outputs.web-outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MOBILE_JOB_RESULT: ${{ needs.deploy-preview-mobile.result }}
          MOBILE_CHANNEL: ${{ needs.deploy-preview-mobile.outputs.mobile-channel }}
          MOBILE_UPDATE_URL: ${{ needs.deploy-preview-mobile.outputs.mobile-update-url }}
          MOBILE_IOS_DOWNLOAD_URL: ${{ needs.deploy-preview-mobile.outputs.mobile-ios-download-url }}
          MOBILE_ANDROID_DOWNLOAD_URL: ${{ needs.deploy-preview-mobile.outputs.mobile-android-download-url }}
          NEEDS_NATIVE_BUILD: ${{ needs.deploy-preview-mobile.outputs.needs-native-build }}
        with:
          script: |
            const marker = '<!-- pr-preview-links -->';
            const domain = process.env.PREVIEW_DOMAIN;
            const prefix = process.env.PREVIEW_PREFIX || 'pr-';
            const prNumber = context.payload.pull_request.number;
            const webUrl = domain ? `https://deploy.${domain}/${prefix}${prNumber}/` : '';
            const runUrl = process.env.RUN_URL;
            const bootstrapUrl = process.env.BOOTSTRAP_URL;
            const isSignedCookies = process.env.ACCESS_MODE === 'signed-cookies';

            const webOutcome          = process.env.WEB_OUTCOME;
            const supabaseOutcome     = process.env.SUPABASE_OUTCOME;
            const stripeSyncOutcome   = process.env.STRIPE_SYNC_OUTCOME;
            const stripeWebhookOutcome = process.env.STRIPE_WEBHOOK_OUTCOME;
            const billingFnsOutcome   = process.env.BILLING_FUNCTIONS_OUTCOME;
            const mobileJobResult     = process.env.MOBILE_JOB_RESULT;
            const mobileChannel       = process.env.MOBILE_CHANNEL;
            const mobileUpdateUrl     = process.env.MOBILE_UPDATE_URL;

            function statusCell(outcome, successLabel) {
              if (outcome === 'success')   return `✅ ${successLabel}`;
              if (outcome === 'failure')   return '❌ Failed';
              if (outcome === 'skipped')   return '⏭️ Skipped';
              if (outcome === 'cancelled') return '🚫 Cancelled';
              return '—';
            }

            // Aggregate billing: any failure beats all; then cancelled; then success
            const billingOutcomes = [stripeSyncOutcome, stripeWebhookOutcome, billingFnsOutcome];
            let billingStatus;
            if (billingOutcomes.some(o => o === 'failure'))        billingStatus = 'failure';
            else if (billingOutcomes.some(o => o === 'cancelled')) billingStatus = 'cancelled';
            else if (billingOutcomes.every(o => o === 'success'))  billingStatus = 'success';
            else billingStatus = billingOutcomes.find(o => o && o !== 'success') || 'success';

            const logsLink = `[View logs](${runUrl})`;
            const webLink = (() => {
              if (webOutcome !== 'success') return logsLink;
              if (isSignedCookies && bootstrapUrl)
                return `[Access preview →](${bootstrapUrl}) _(sets cookie, expires 7 days)_`;
              return webUrl ? `[Preview →](${webUrl})` : '—';
            })();

            const mobileStatus =
              mobileJobResult === 'skipped' ? 'skipped' :
              (mobileJobResult === 'success' && !mobileUpdateUrl) ? 'skipped' :
              mobileJobResult || 'skipped';
            const mobileLinkCell = mobileJobResult === 'failure' ? logsLink : '—';

            const table = [
              '| Component | Status | Link |',
              '|-----------|--------|------|',
              `| 🌐 Web | ${statusCell(webOutcome, 'Deployed')} | ${webLink} |`,
              `| 🗄️ Database | ${statusCell(supabaseOutcome, 'Migrated')} | ${supabaseOutcome === 'failure' ? logsLink : '—'} |`,
              `| 💳 Billing | ${statusCell(billingStatus, 'Deployed')} | ${billingStatus === 'failure' ? logsLink : '—'} |`,
              `| 📱 Mobile | ${statusCell(mobileStatus, 'Deployed')} | ${mobileLinkCell} |`,
            ].join('\n');

            // HH:MM PT timestamp
            const now = new Date();
            const timeStr = now.toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
            });
            const tzStr = now.toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              timeZoneName: 'short',
            }).split(', ').pop().split(' ').pop();

            const lines = [];
            lines.push(marker);
            lines.push('');
            lines.push(table);
            lines.push('');
            lines.push(`_Last deployed: ${timeStr} ${tzStr}_`);

            // Mobile detail section — only when mobile succeeded with an update URL
            if (mobileJobResult !== 'skipped' && mobileJobResult !== 'failure' && mobileUpdateUrl) {
              const iosDownloadUrl = process.env.MOBILE_IOS_DOWNLOAD_URL;
              const androidDownloadUrl = process.env.MOBILE_ANDROID_DOWNLOAD_URL;
              const needsNativeBuild = process.env.NEEDS_NATIVE_BUILD === 'true';

              lines.push('');
              lines.push('---');
              lines.push('');
              lines.push(`📱 **Mobile preview:** Channel \`${mobileChannel}\``);
              lines.push('');

              if (iosDownloadUrl || androidDownloadUrl) {
                lines.push('### 📱 Mobile Preview Builds');
                lines.push('');
                lines.push('**Native builds are available for download:**');
                lines.push('');

                if (iosDownloadUrl) {
                  lines.push('**iOS Simulator Build:**');
                  lines.push(`- [Download .app file](${iosDownloadUrl})`);
                  lines.push('- Install with: `xcrun simctl install booted ~/Downloads/BeakerStack.app`');
                  lines.push('');
                }

                if (androidDownloadUrl) {
                  lines.push('**Android Build (Device & Emulator):**');
                  lines.push(`- [Download .apk file](${androidDownloadUrl})`);
                  lines.push('- Install with: `adb install ~/Downloads/BeakerStack.apk`');
                  lines.push('');
                }

                lines.push('**Note:** These builds include the preview Supabase configuration and are ready to use.');
                lines.push('');
              } else if (needsNativeBuild) {
                lines.push('### 📱 Mobile Preview Builds');
                lines.push('');
                lines.push('⚠️ **Native build in progress or not finished...**');
                lines.push('');
                lines.push('Native code changes were detected. EAS builds may take 10–15 minutes after the **deploy-preview-mobile** job completes.');
                lines.push('If the job already finished without download links, check the workflow logs and the [Expo builds dashboard](https://expo.dev/accounts/artificer-innovations-llc/projects/beaker-stack/builds).');
                lines.push('');
              } else {
                lines.push('### 📱 Mobile Preview (OTA Updates)');
                lines.push('');
                lines.push('**No native code changes detected** - using OTA updates only.');
                lines.push('');
                lines.push('⚠️ **Note:** This app requires a **Development Build** (Expo Go will not work due to native Google OAuth).');
                lines.push('');
                lines.push('**Step 1: Install Development Build (one-time setup)**');
                lines.push('1. Build: `npm run mobile:build:dev:ios` (or `mobile:build:dev:android`)');
                lines.push('2. Download from [Expo dashboard](https://expo.dev/accounts/artificer-innovations-llc/projects/beaker-stack/builds)');
                lines.push('3. Install: `EAS_BUILD_PATH=~/Downloads/BeakerStack.ipa npm run mobile:install:dev:ios` (iOS) or `EAS_BUILD_PATH=~/Downloads/BeakerStack.apk npm run mobile:install:dev:android` (Android)');
                lines.push('');
                lines.push('**Step 2: Load PR Preview Update**');
                lines.push(`1. Open the development build on your device/simulator`);
                lines.push(`2. Shake device (or Cmd+D on iOS / Cmd+M on Android) → "Enter URL manually"`);
                lines.push(`3. Paste the update URL: \`${mobileUpdateUrl}\``);
                lines.push(`4. The app will reload with the JavaScript bundle from channel \`${mobileChannel}\``);
                lines.push('');
                lines.push(`**Note:** You must use the full URL format - just entering the channel name (\`${mobileChannel}\`) will not work.`);
                lines.push('');
                lines.push(`**Alternative:** For local development, use: \`cd apps/mobile && npx expo start --dev-client\`, then press 'i' for iOS simulator.`);
                lines.push('');
              }

              lines.push('📖 See [Mobile Build Testing Guide](../../docs/MOBILE_BUILD_TESTING.md) for detailed instructions.');
            }

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(comment => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  lighthouse:
    if: >-
      github.event.action != 'closed' &&
      needs.deploy-preview.result == 'success' &&
      needs.deploy-preview.outputs.access-mode != 'signed-cookies'
    needs: [deploy-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli@0.14

      - name: Warm up preview URL
        env:
          PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
          PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
        run: |
          set -euo pipefail
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          URL="https://deploy.${PREVIEW_DOMAIN}/${PREVIEW_PREFIX_VALUE}${{ github.event.pull_request.number }}/"
          echo "Warming up ${URL}"
          curl -sf --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${URL}" -o /dev/null
          sleep 5

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
          PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
        run: |
          set -euo pipefail
          if [[ -z "${LHCI_GITHUB_APP_TOKEN:-}" ]]; then
            echo "LHCI_GITHUB_APP_TOKEN not set — skipping Lighthouse CI."
            exit 0
          fi
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          URL="https://deploy.${PREVIEW_DOMAIN}/${PREVIEW_PREFIX_VALUE}${{ github.event.pull_request.number }}/"
          lhci autorun --collect.url="${URL}"

  teardown-preview:
    if: github.event.action == 'closed' && (github.base_ref != 'develop' || github.head_ref != 'main')
    runs-on: ubuntu-latest
    env:
      PREVIEW_STACK_NAME: ${{ vars.PR_PREVIEW_STACK_NAME }}
      PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
      SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}

      - name: Resolve infrastructure outputs
        id: describe
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${PREVIEW_STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PREVIEW_AWS_REGION:-us-east-1}"
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='DeployBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='DeployDistributionId'].OutputValue" \
            --output text)
          {
            echo "WEBSITE_BUCKET=${WEBSITE_BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
          } >>"${GITHUB_OUTPUT}"

      - name: Run preview teardown
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUMBER_VALUE="${PR_NUMBER}"
          PREVIEW_PREFIX_VALUE="${PREVIEW_PREFIX:-pr-}"
          AWS_REGION_VALUE="${PREVIEW_AWS_REGION:-us-east-1}"
          ./scripts/pr-preview/teardown.sh \
            --pr-number "${PR_NUMBER_VALUE}" \
            --bucket "${{ steps.describe.outputs.WEBSITE_BUCKET }}" \
            --distribution-id "${{ steps.describe.outputs.DISTRIBUTION_ID }}" \
            --preview-prefix "${PREVIEW_PREFIX_VALUE}" \
            --region "${AWS_REGION_VALUE}" \
            --supabase-db-url "${SUPABASE_PREVIEW_DB_URL}"

      - name: Clean up GitHub Deployment and environment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            // Fork PRs cannot write to Deployments API — skip cleanly.
            const headRepo = context.payload.pull_request.head.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (!headRepo || headRepo !== baseRepo) {
              core.info(`Skipping: fork PR (${headRepo ?? 'deleted repo'}) — Deployments API write not available.`);
              return;
            }

            const environment = `pr-${process.env.PR_NUMBER}-preview`;

            // List all deployments for this environment (up to 100).
            let deployments = [];
            try {
              const { data } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment,
                per_page: 100,
              });
              deployments = data;
            } catch (err) {
              if (err.status === 404) {
                core.info(`No deployments found for ${environment} — nothing to clean up.`);
                return;
              }
              throw err;
            }

            if (deployments.length === 0) {
              core.info(`No deployments for ${environment} — nothing to clean up.`);
            }

            for (const dep of deployments) {
              // GitHub requires inactive status before a deployment can be deleted.
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: dep.id,
                  state: 'inactive',
                });
              } catch (err) {
                if (err.status === 404) {
                  core.info(`Deployment ${dep.id} already gone — skipping inactive status.`);
                } else {
                  core.warning(`Could not mark deployment ${dep.id} inactive: ${err.message}`);
                }
              }
              try {
                await github.rest.repos.deleteDeployment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: dep.id,
                });
                core.info(`Deleted deployment ${dep.id}.`);
              } catch (err) {
                if (err.status === 404) {
                  core.info(`Deployment ${dep.id} already deleted.`);
                } else {
                  core.warning(`Could not delete deployment ${dep.id}: ${err.message}`);
                }
              }
            }

            // Delete the GitHub environment so it no longer appears in the Environments list.
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: environment,
              });
              core.info(`Deleted environment ${environment}.`);
            } catch (err) {
              if (err.status === 404) {
                core.info(`Environment ${environment} already gone — nothing to delete.`);
              } else {
                core.warning(`Could not delete environment ${environment}: ${err.message}`);
              }
            }
