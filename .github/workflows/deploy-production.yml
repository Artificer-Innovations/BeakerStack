# Deploys production (apex <domain>) when commits land on main — typically after develop→main promotion is merged.
# Does not run on feature branches or on pull_request events.
name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd supabase

          # Link to production Supabase project
          supabase link \
            --project-ref "${PRODUCTION_SUPABASE_PROJECT_REF}" \
            --password "${PRODUCTION_SUPABASE_DB_PASSWORD}" \
            --yes

          # Apply only new migrations (does not reset existing data)
          supabase db push --linked

      - name: Apply adopter database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: npm run db:apply-adopter -- --linked

      # Opt-in: skipped in-script when RESEND_SMTP_PASS unset (secrets cannot be used in if:)
      - name: Regenerate email templates
        run: npm run email:personalize -- --non-interactive

      - name: Sync Supabase auth email config (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          SUPABASE_AUTH_SITE_URL: ${{ format('https://{0}', vars.PR_PREVIEW_DOMAIN) }}
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: '587'
          SMTP_USER: resend
          SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_PASS:-}" ]; then
            echo "Skipping Supabase auth email config: RESEND_SMTP_PASS is not set."
            exit 0
          fi
          if [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}" ] || [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-}" ]; then
            echo "Skipping Supabase auth email config: SUPABASE_AUTH_EXTERNAL_GOOGLE_* secrets are not set."
            echo "  Run npm run setup:full (google phase) or: gh secret set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID"
            exit 0
          fi
          ./scripts/sync-supabase-auth-config.sh \
            --project-ref "${PRODUCTION_SUPABASE_PROJECT_REF}" \
            --db-password "${PRODUCTION_SUPABASE_DB_PASSWORD}" \
            --site-url "${SUPABASE_AUTH_SITE_URL}"

      - name: Sync Stripe prices to billing_plans
        env:
          STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run billing:sync-stripe

      - name: Ensure Stripe webhook endpoint (production)
        id: stripe_webhook_production
        env:
          STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}/functions/v1/stripe-webhook
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
          WEBHOOK_DESCRIPTION: BeakerStack production (${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }})
        run: node scripts/ensure-stripe-webhook-endpoint.mjs

      - name: Sync edge shared packages
        run: npm run functions:sync-shared

      - name: Ensure Kit webhook endpoint (production)
        continue-on-error: true
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          WEBHOOK_DESCRIPTION: BeakerStack production kit-webhook (${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }})
        run: |
          [[ -z "${KIT_API_KEY:-}" ]] && { echo "KIT_API_KEY not set — skipping Kit webhook ensure"; exit 0; }
          node scripts/ensure-kit-webhook-endpoint.mjs

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ steps.stripe_webhook_production.outputs.resolved_webhook_secret }}
          PRODUCTION_BILLING_ALLOWED_ORIGINS: ${{ secrets.PRODUCTION_BILLING_ALLOWED_ORIGINS }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_CRON_SECRET: ${{ secrets.KIT_CRON_SECRET }}
          KIT_WEBHOOK_SECRET: ${{ secrets.KIT_WEBHOOK_SECRET }}
          PRODUCTION_KIT_API_KEY: ${{ secrets.PRODUCTION_KIT_API_KEY }}
          PRODUCTION_KIT_CRON_SECRET: ${{ secrets.PRODUCTION_KIT_CRON_SECRET }}
          PRODUCTION_KIT_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_KIT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          cd supabase
          supabase link \
            --project-ref "${PRODUCTION_SUPABASE_PROJECT_REF}" \
            --password "${PRODUCTION_SUPABASE_DB_PASSWORD}" \
            --yes
          supabase secrets set \
            STRIPE_SECRET_KEY="${PRODUCTION_STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${PRODUCTION_STRIPE_WEBHOOK_SECRET}" \
            BILLING_SUPABASE_URL="${PRODUCTION_SUPABASE_URL}" \
            BILLING_SUPABASE_ANON_KEY="${PRODUCTION_SUPABASE_ANON_KEY}" \
            BILLING_SUPABASE_SERVICE_ROLE_KEY="${PRODUCTION_SUPABASE_SERVICE_ROLE_KEY}" \
            BILLING_ALLOWED_ORIGINS="${PRODUCTION_BILLING_ALLOWED_ORIGINS}"
          RESOLVED_KIT_API_KEY="${KIT_API_KEY:-${PRODUCTION_KIT_API_KEY:-}}"
          RESOLVED_KIT_CRON_SECRET="${KIT_CRON_SECRET:-${PRODUCTION_KIT_CRON_SECRET:-}}"
          RESOLVED_KIT_WEBHOOK_SECRET="${KIT_WEBHOOK_SECRET:-${PRODUCTION_KIT_WEBHOOK_SECRET:-}}"
          [[ -n "${RESOLVED_KIT_API_KEY}" ]] && supabase secrets set KIT_API_KEY="${RESOLVED_KIT_API_KEY}"
          [[ -n "${RESOLVED_KIT_CRON_SECRET}" ]] && supabase secrets set KIT_CRON_SECRET="${RESOLVED_KIT_CRON_SECRET}"
          [[ -n "${RESOLVED_KIT_WEBHOOK_SECRET}" ]] && supabase secrets set KIT_WEBHOOK_SECRET="${RESOLVED_KIT_WEBHOOK_SECRET}"
          supabase functions deploy stripe-webhook billing-stripe waitlist-capture waitlist-ops kit-sync kit-webhook \
            --project-ref "${PRODUCTION_SUPABASE_PROJECT_REF}"

      - name: Ensure kit-sync cron job (production)
        env:
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          KIT_CRON_SECRET: ${{ secrets.KIT_CRON_SECRET }}
          PRODUCTION_KIT_CRON_SECRET: ${{ secrets.PRODUCTION_KIT_CRON_SECRET }}
        run: |
          RESOLVED_KIT_CRON_SECRET="${KIT_CRON_SECRET:-${PRODUCTION_KIT_CRON_SECRET:-}}"
          [[ -z "${RESOLVED_KIT_CRON_SECRET}" ]] && { echo "KIT_CRON_SECRET not set — skipping cron registration"; exit 0; }
          KIT_CRON_SECRET="${RESOLVED_KIT_CRON_SECRET}" node scripts/ensure-kit-sync-cron.mjs

  deploy-web-production:
    needs: [deploy-backend-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
      STACK_NAME: ${{ vars.PR_PREVIEW_STACK_NAME }}
      VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      VITE_PLAUSIBLE_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}

      - name: Resolve infrastructure outputs
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PR_PREVIEW_AWS_REGION:-us-east-1}"
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProdBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProdDistributionId'].OutputValue" \
            --output text)
          {
            echo "BUCKET=${BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and deploy to production
        shell: bash
        env:
          AWS_REGION_VALUE: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          ./scripts/pr-preview/deploy-web.sh \
            --bucket "${{ steps.infra.outputs.BUCKET }}" \
            --distribution-id "${{ steps.infra.outputs.DISTRIBUTION_ID }}" \
            --domain "${DOMAIN}" \
            --environment prod \
            --region "${AWS_REGION_VALUE}"

  deploy-finalize-production:
    needs: [deploy-web-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
    steps:
      - name: Create GitHub Deployment (production)
        uses: actions/github-script@v7
        env:
          PRODUCTION_URL: ${{ format('https://{0}/', env.DOMAIN) }}
        with:
          script: |
            const environmentUrl = process.env.PRODUCTION_URL;
            const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Production deployment',
            });
            if (!deployment.data.id) {
              core.warning(`createDeployment returned no id (HTTP ${deployment.status}): ${deployment.data.message ?? JSON.stringify(deployment.data)}`);
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: environmentUrl,
              log_url: logUrl,
              description: 'Production deployed',
            });

      - name: Write Actions run summary
        shell: bash
        env:
          PRODUCTION_URL: ${{ format('https://{0}/', env.DOMAIN) }}
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ## Production Deployment

          **Production URL:** ${PRODUCTION_URL}
          SUMMARY

  deploy-mobile-production:
    if: vars.MOBILE_ENABLED != 'false'
    needs: [deploy-backend-production]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy mobile to production
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          EXPO_ACCOUNT_VALUE="${{ vars.EXPO_ACCOUNT }}"
          if [[ -z "${EXPO_ACCOUNT_VALUE}" ]]; then
            if [[ "${{ vars.MOBILE_ENABLED }}" == "true" ]]; then
              echo "::error::EXPO_ACCOUNT variable is not set but MOBILE_ENABLED=true. Set vars.MOBILE_ENABLED=false to disable mobile, or provide EXPO_ACCOUNT."
              exit 1
            else
              echo "Warning: EXPO_ACCOUNT not set, skipping mobile deployment"
              exit 0
            fi
          fi
          ./scripts/pr-preview/deploy-mobile-production.sh \
            --expo-account "${EXPO_ACCOUNT_VALUE}" \
            --platform all \
            --message "Production deployment from ${GITHUB_SHA:0:7}"
