name: E2E Web (PR Approval)

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  deployments: read

concurrency:
  group: e2e-web-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e-web:
    if: |
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'ZappoMan' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
      PREVIEW_PREFIX: ${{ vars.PR_PREVIEW_PREFIX }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify PR preview deployment matches HEAD
        id: preview
        uses: actions/github-script@v7
        env:
          PREVIEW_DOMAIN: ${{ env.PREVIEW_DOMAIN }}
          PREVIEW_PREFIX: ${{ env.PREVIEW_PREFIX }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const prNumber = process.env.PR_NUMBER;
            const environment = `pr-${prNumber}-preview`;
            const prefix = process.env.PREVIEW_PREFIX || 'pr-';
            const domain = process.env.PREVIEW_DOMAIN;
            if (!domain) {
              core.setFailed('PR_PREVIEW_DOMAIN is not configured.');
              return;
            }
            const webUrl = `https://deploy.${domain}/${prefix}${prNumber}/`;
            const basePath = `/${prefix}${prNumber}`;
            core.setOutput('web_url', webUrl);
            core.setOutput('web_base_path', basePath);

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment,
              per_page: 20,
            });
            if (!deployments.length) {
              core.setFailed(
                `No deployment found for environment ${environment}. Wait for the PR Preview workflow to finish.`
              );
              return;
            }

            let matched = false;
            for (const deployment of deployments) {
              if (deployment.sha !== headSha) {
                continue;
              }
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 5,
              });
              const success = statuses.find(s => s.state === 'success');
              if (success) {
                matched = true;
                break;
              }
            }

            if (!matched) {
              core.setFailed(
                `Preview is not deployed for commit ${headSha.slice(0, 7)}. Push again or wait for PR Preview to complete before approving.`
              );
            }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate signed cookie bootstrap URL
        id: signed_cookies
        if: steps.preview.outcome == 'success'
        shell: bash
        env:
          CLOUDFRONT_SIGNING_KEY: ${{ secrets.CLOUDFRONT_SIGNING_KEY }}
          CLOUDFRONT_SIGNING_KEY_ID: ${{ secrets.CLOUDFRONT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          eval "$(./scripts/pr-preview/generate-preview-bootstrap-url.sh \
            --domain "${PREVIEW_DOMAIN}" \
            --preview-prefix "${PREVIEW_PREFIX:-pr-}" \
            --pr-number "${PR_NUMBER}" \
            --signing-key "${CLOUDFRONT_SIGNING_KEY:-}" \
            --signing-key-id "${CLOUDFRONT_SIGNING_KEY_ID:-}")"

      - name: Warm up preview URL
        if: steps.preview.outcome == 'success'
        run: |
          set -euo pipefail
          URL="${{ steps.preview.outputs.web_url }}"
          curl -sf --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${URL}" -o /dev/null || true
          sleep 5

      - name: Run Playwright web E2E tests
        id: playwright
        if: steps.preview.outcome == 'success'
        env:
          CI: true
          E2E_TARGET: preview
          WEB_URL: ${{ steps.preview.outputs.web_url }}
          WEB_BASE_PATH: ${{ steps.preview.outputs.web_base_path }}
          E2E_BOOTSTRAP_URL: ${{ steps.signed_cookies.outputs.BOOTSTRAP_URL }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          PR_TESTING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_TESTING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e:web

      - name: Upload Playwright report
        if: always() && steps.playwright.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-playwright-report-pr-${{ github.event.pull_request.number }}
          path: |
            tests/e2e/web/report/
            tests/e2e/web/test-results/
            tests/e2e/web/results/
          if-no-files-found: ignore

      - name: Format E2E PR comment
        id: e2e_comment
        if: always() && steps.preview.outcome == 'success'
        env:
          WEB_URL: ${{ steps.preview.outputs.web_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          PLAYWRIGHT_JSON_REPORT: tests/e2e/web/results/web-results.json
        run: node scripts/ci/format-playwright-e2e-pr-comment.mjs

      - name: Post E2E results comment
        if: always() && steps.preview.outcome == 'success'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.e2e_comment.outputs.body }}
        with:
          script: |
            const marker = '<!-- e2e-web-results -->';
            const body = process.env.COMMENT_BODY;
            if (!body?.includes(marker)) {
              core.setFailed('E2E comment body missing marker.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.body?.includes(marker) && c.user?.type === 'Bot'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
