# Deploys staging (staging.<domain>) when commits land on develop — typically after a PR into develop is merged.
# Does not run on feature branches or on pull_request synchronize; use pr-preview-environment.yml for PR previews.
name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-backend-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd supabase

          # Link to staging Supabase project
          supabase link \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}" \
            --password "${STAGING_SUPABASE_DB_PASSWORD}" \
            --yes

          # Apply only new migrations (does not reset existing data)
          supabase db push --linked

      - name: Apply adopter database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: npm run db:apply-adopter -- --linked

      # Opt-in: skipped in-script when RESEND_SMTP_PASS unset (secrets cannot be used in if:)
      - name: Regenerate email templates
        run: npm run email:personalize -- --non-interactive

      - name: Sync Supabase auth email config (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_AUTH_SITE_URL: ${{ format('https://staging.{0}', vars.PR_PREVIEW_DOMAIN) }}
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: '587'
          SMTP_USER: resend
          SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ vars.SMTP_SENDER_NAME }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_PASS:-}" ]; then
            echo "Skipping Supabase auth email config: RESEND_SMTP_PASS is not set."
            exit 0
          fi
          if [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}" ] || [ -z "${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-}" ]; then
            echo "Skipping Supabase auth email config: SUPABASE_AUTH_EXTERNAL_GOOGLE_* secrets are not set."
            echo "  Run npm run setup:full (google phase) or: gh secret set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID"
            exit 0
          fi
          ./scripts/sync-supabase-auth-config.sh \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}" \
            --db-password "${STAGING_SUPABASE_DB_PASSWORD}" \
            --site-url "${SUPABASE_AUTH_SITE_URL}"

      - name: Sync Stripe prices to billing_plans
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run billing:sync-stripe

      - name: Ensure Stripe webhook endpoint (staging)
        id: stripe_webhook_staging
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_URL: ${{ secrets.STAGING_SUPABASE_URL }}/functions/v1/stripe-webhook
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          WEBHOOK_DESCRIPTION: BeakerStack staging (${{ secrets.STAGING_SUPABASE_PROJECT_REF }})
        run: node scripts/ensure-stripe-webhook-endpoint.mjs

      - name: Sync edge shared packages
        run: npm run functions:sync-shared

      - name: Ensure Kit webhook endpoint (staging)
        continue-on-error: true
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          WEBHOOK_DESCRIPTION: BeakerStack staging kit-webhook (${{ secrets.STAGING_SUPABASE_PROJECT_REF }})
        run: |
          [[ -z "${KIT_API_KEY:-}" ]] && { echo "KIT_API_KEY not set — skipping Kit webhook ensure"; exit 0; }
          node scripts/ensure-kit-webhook-endpoint.mjs

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ steps.stripe_webhook_staging.outputs.resolved_webhook_secret }}
          STAGING_BILLING_ALLOWED_ORIGINS: ${{ secrets.STAGING_BILLING_ALLOWED_ORIGINS }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_CRON_SECRET: ${{ secrets.KIT_CRON_SECRET }}
          KIT_WEBHOOK_SECRET: ${{ secrets.KIT_WEBHOOK_SECRET }}
          STAGING_KIT_API_KEY: ${{ secrets.STAGING_KIT_API_KEY }}
          STAGING_KIT_CRON_SECRET: ${{ secrets.STAGING_KIT_CRON_SECRET }}
          STAGING_KIT_WEBHOOK_SECRET: ${{ secrets.STAGING_KIT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          cd supabase
          supabase link \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}" \
            --password "${STAGING_SUPABASE_DB_PASSWORD}" \
            --yes
          supabase secrets set \
            STRIPE_SECRET_KEY="${STAGING_STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${STAGING_STRIPE_WEBHOOK_SECRET}" \
            BILLING_SUPABASE_URL="${STAGING_SUPABASE_URL}" \
            BILLING_SUPABASE_ANON_KEY="${STAGING_SUPABASE_ANON_KEY}" \
            BILLING_SUPABASE_SERVICE_ROLE_KEY="${STAGING_SUPABASE_SERVICE_ROLE_KEY}" \
            BILLING_ALLOWED_ORIGINS="${STAGING_BILLING_ALLOWED_ORIGINS}"
          # Prefer shared KIT_* secrets; fall back to legacy STAGING_KIT_* names.
          RESOLVED_KIT_API_KEY="${KIT_API_KEY:-${STAGING_KIT_API_KEY:-}}"
          RESOLVED_KIT_CRON_SECRET="${KIT_CRON_SECRET:-${STAGING_KIT_CRON_SECRET:-}}"
          RESOLVED_KIT_WEBHOOK_SECRET="${KIT_WEBHOOK_SECRET:-${STAGING_KIT_WEBHOOK_SECRET:-}}"
          # Only set Kit secrets when configured; empty strings would clobber manual Supabase secrets.
          [[ -n "${RESOLVED_KIT_API_KEY}" ]] && supabase secrets set KIT_API_KEY="${RESOLVED_KIT_API_KEY}"
          [[ -n "${RESOLVED_KIT_CRON_SECRET}" ]] && supabase secrets set KIT_CRON_SECRET="${RESOLVED_KIT_CRON_SECRET}"
          [[ -n "${RESOLVED_KIT_WEBHOOK_SECRET}" ]] && supabase secrets set KIT_WEBHOOK_SECRET="${RESOLVED_KIT_WEBHOOK_SECRET}"
          supabase functions deploy stripe-webhook billing-stripe waitlist-capture waitlist-ops kit-sync kit-webhook \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}"

      - name: Ensure kit-sync cron job (staging)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          KIT_CRON_SECRET: ${{ secrets.KIT_CRON_SECRET }}
          STAGING_KIT_CRON_SECRET: ${{ secrets.STAGING_KIT_CRON_SECRET }}
        run: |
          RESOLVED_KIT_CRON_SECRET="${KIT_CRON_SECRET:-${STAGING_KIT_CRON_SECRET:-}}"
          [[ -z "${RESOLVED_KIT_CRON_SECRET}" ]] && { echo "KIT_CRON_SECRET not set — skipping cron registration"; exit 0; }
          KIT_CRON_SECRET="${RESOLVED_KIT_CRON_SECRET}" node scripts/ensure-kit-sync-cron.mjs

  deploy-web-staging:
    needs: [deploy-backend-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
      STACK_NAME: ${{ vars.PR_PREVIEW_STACK_NAME }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: staging
      VITE_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}

      - name: Resolve infrastructure outputs
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PR_PREVIEW_AWS_REGION:-us-east-1}"
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='StagingBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='StagingDistributionId'].OutputValue" \
            --output text)
          {
            echo "BUCKET=${BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and deploy to staging
        shell: bash
        env:
          AWS_REGION_VALUE: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          ./scripts/pr-preview/deploy-web.sh \
            --bucket "${{ steps.infra.outputs.BUCKET }}" \
            --distribution-id "${{ steps.infra.outputs.DISTRIBUTION_ID }}" \
            --domain "${DOMAIN}" \
            --environment staging \
            --region "${AWS_REGION_VALUE}"

  deploy-finalize-staging:
    needs: [deploy-web-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
    steps:
      - name: Generate staging signed cookie bootstrap URL
        id: signed_cookies
        shell: bash
        env:
          CLOUDFRONT_SIGNING_KEY: ${{ secrets.CLOUDFRONT_SIGNING_KEY }}
          CLOUDFRONT_SIGNING_KEY_ID: ${{ secrets.CLOUDFRONT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          # secrets.* is not allowed in step `if:` — gate here (direct URL access when neither secret is set).
          if [[ -z "${CLOUDFRONT_SIGNING_KEY:-}" && -z "${CLOUDFRONT_SIGNING_KEY_ID:-}" ]]; then
            exit 0
          fi
          if [[ -z "${CLOUDFRONT_SIGNING_KEY:-}" || -z "${CLOUDFRONT_SIGNING_KEY_ID:-}" ]]; then
            echo "::error::CLOUDFRONT_SIGNING_KEY and CLOUDFRONT_SIGNING_KEY_ID must both be set. Configure both secrets or neither."
            exit 1
          fi
          STAGING_DOMAIN="staging.${DOMAIN}"
          RESOURCE="https://${STAGING_DOMAIN}/*"
          EXPIRY=$(date -u -d "+30 days" +%s)

          POLICY_JSON=$(printf '{"Statement":[{"Resource":"%s","Condition":{"DateLessThan":{"AWS:EpochTime":%s}}}]}' \
            "${RESOURCE}" "${EXPIRY}")

          # CloudFront URL-safe base64: + → -, / → ~, = → _
          CF_POLICY=$(printf '%s' "${POLICY_JSON}" | base64 -w0 | tr '+' '-' | tr '/' '~' | tr '=' '_')

          # Sign with RSA-SHA1 (CloudFront signed cookies requirement)
          KEY_FILE=$(mktemp); chmod 600 "${KEY_FILE}"
          printf '%s' "${CLOUDFRONT_SIGNING_KEY}" > "${KEY_FILE}"
          CF_SIGNATURE=$(printf '%s' "${POLICY_JSON}" | \
            openssl dgst -sha1 -sign "${KEY_FILE}" | base64 -w0 | tr '+' '-' | tr '/' '~' | tr '=' '_')
          rm -f "${KEY_FILE}"
          BOOTSTRAP_URL="https://${STAGING_DOMAIN}/_preview-auth?policy=${CF_POLICY}&sig=${CF_SIGNATURE}&kid=${CLOUDFRONT_SIGNING_KEY_ID}&dest=/"
          echo "BOOTSTRAP_URL=${BOOTSTRAP_URL}" >> "${GITHUB_OUTPUT}"
          echo "STAGING_URL=https://${STAGING_DOMAIN}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Deployment (staging)
        uses: actions/github-script@v7
        env:
          BOOTSTRAP_URL: ${{ steps.signed_cookies.outputs.BOOTSTRAP_URL }}
          STAGING_URL: ${{ steps.signed_cookies.outputs.STAGING_URL || format('https://staging.{0}', env.DOMAIN) }}
        with:
          script: |
            const environmentUrl = process.env.BOOTSTRAP_URL || process.env.STAGING_URL;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              auto_merge: false,
              required_contexts: [],
              description: 'Staging deployment',
            });
            if (deployment.data.id) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: environmentUrl,
                description: 'Staging deployed',
              });
            }

      - name: Write Actions run summary
        shell: bash
        env:
          BOOTSTRAP_URL: ${{ steps.signed_cookies.outputs.BOOTSTRAP_URL }}
          STAGING_URL: ${{ steps.signed_cookies.outputs.STAGING_URL || format('https://staging.{0}', env.DOMAIN) }}
        run: |
          set -euo pipefail
          if [[ -n "${BOOTSTRAP_URL}" ]]; then
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ## Staging Deployment

          **Access link (signed cookies):** ${BOOTSTRAP_URL}

          > Click the link to set your access cookie, then browse staging normally. Expires in 30 days.
          SUMMARY
          else
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ## Staging Deployment

          **Staging URL:** ${STAGING_URL}
          SUMMARY
          fi

  deploy-mobile-staging:
    if: vars.MOBILE_ENABLED != 'false'
    needs: [deploy-backend-staging]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy mobile to staging
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          EXPO_ACCOUNT_VALUE="${{ vars.EXPO_ACCOUNT }}"
          if [[ -z "${EXPO_ACCOUNT_VALUE}" ]]; then
            if [[ "${{ vars.MOBILE_ENABLED }}" == "true" ]]; then
              echo "::error::EXPO_ACCOUNT variable is not set but MOBILE_ENABLED=true. Set vars.MOBILE_ENABLED=false to disable mobile, or provide EXPO_ACCOUNT."
              exit 1
            else
              echo "Warning: EXPO_ACCOUNT not set, skipping mobile deployment"
              exit 0
            fi
          fi
          ./scripts/pr-preview/deploy-mobile-staging.sh \
            --expo-account "${EXPO_ACCOUNT_VALUE}" \
            --platform all \
            --message "Staging deployment from ${GITHUB_SHA:0:7}"
