name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.PR_PREVIEW_DOMAIN }}
      STACK_NAME: ${{ vars.PR_PREVIEW_STACK_NAME }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd supabase
          
          # Link to staging Supabase project
          supabase link \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}" \
            --password "${STAGING_SUPABASE_DB_PASSWORD}" \
            --yes
          
          # Apply only new migrations (does not reset existing data)
          supabase db push --linked

      - name: Sync Stripe prices to billing_plans
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run billing:sync-stripe

      - name: Ensure Stripe webhook endpoint (staging)
        id: stripe_webhook_staging
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_URL: ${{ secrets.STAGING_SUPABASE_URL }}/functions/v1/stripe-webhook
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          WEBHOOK_DESCRIPTION: BeakerStack staging (${{ secrets.STAGING_SUPABASE_PROJECT_REF }})
        run: node scripts/ensure-stripe-webhook-endpoint.mjs

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ steps.stripe_webhook_staging.outputs.resolved_webhook_secret }}
          STAGING_BILLING_ALLOWED_ORIGINS: ${{ secrets.STAGING_BILLING_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          cd supabase
          supabase link \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}" \
            --password "${STAGING_SUPABASE_DB_PASSWORD}" \
            --yes
          supabase secrets set \
            STRIPE_SECRET_KEY="${STAGING_STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${STAGING_STRIPE_WEBHOOK_SECRET}" \
            BILLING_SUPABASE_URL="${STAGING_SUPABASE_URL}" \
            BILLING_SUPABASE_ANON_KEY="${STAGING_SUPABASE_ANON_KEY}" \
            BILLING_SUPABASE_SERVICE_ROLE_KEY="${STAGING_SUPABASE_SERVICE_ROLE_KEY}" \
            BILLING_ALLOWED_ORIGINS="${STAGING_BILLING_ALLOWED_ORIGINS}"
          supabase functions deploy stripe-webhook billing-stripe \
            --project-ref "${STAGING_SUPABASE_PROJECT_REF}"

      - name: Resolve infrastructure outputs
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${STACK_NAME:-beakerstack-pr-preview}"
          AWS_REGION_VALUE="${PR_PREVIEW_AWS_REGION:-us-east-1}"
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='StagingBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION_VALUE}" \
            --query "Stacks[0].Outputs[?OutputKey=='StagingDistributionId'].OutputValue" \
            --output text)
          {
            echo "BUCKET=${BUCKET}"
            echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and deploy to staging
        shell: bash
        env:
          AWS_REGION_VALUE: ${{ vars.PR_PREVIEW_AWS_REGION != '' && vars.PR_PREVIEW_AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          ./scripts/pr-preview/deploy-web.sh \
            --bucket "${{ steps.infra.outputs.BUCKET }}" \
            --distribution-id "${{ steps.infra.outputs.DISTRIBUTION_ID }}" \
            --domain "${DOMAIN}" \
            --environment staging \
            --region "${AWS_REGION_VALUE}"

  deploy-mobile-staging:
    if: vars.MOBILE_ENABLED != 'false'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy mobile to staging
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          EXPO_ACCOUNT_VALUE="${{ vars.EXPO_ACCOUNT }}"
          if [[ -z "${EXPO_ACCOUNT_VALUE}" ]]; then
            if [[ "${{ vars.MOBILE_ENABLED }}" == "true" ]]; then
              echo "::error::EXPO_ACCOUNT variable is not set but MOBILE_ENABLED=true. Set vars.MOBILE_ENABLED=false to disable mobile, or provide EXPO_ACCOUNT."
              exit 1
            else
              echo "Warning: EXPO_ACCOUNT not set, skipping mobile deployment"
              exit 0
            fi
          fi
          ./scripts/pr-preview/deploy-mobile-staging.sh \
            --expo-account "${EXPO_ACCOUNT_VALUE}" \
            --platform all \
            --message "Staging deployment from ${GITHUB_SHA:0:7}"
