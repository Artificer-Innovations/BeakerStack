name: Setup Node
description: Install Node.js 22.22+ and run npm ci (run actions/checkout first)

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.22
        cache: npm

    - name: Assert Node.js minimum version
      shell: bash
      run: |
        set -euo pipefail
        MIN="22.22.0"
        ACTUAL="$(node -v | sed 's/^v//')"
        if [ "$(printf '%s\n' "$MIN" "$ACTUAL" | sort -V | head -1)" != "$MIN" ]; then
          echo "Node.js $ACTUAL is below required minimum $MIN" >&2
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      run: npm ci
