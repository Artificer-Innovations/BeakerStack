name: Setup Node
description: Checkout repository, install Node.js 20, and run npm ci

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
